name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, attest, and publish release assets for (creates the release if it does not exist yet)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" main.js manifest.json styles.css --repo "${{ github.repository }}" --title "$TAG" --generate-notes \
            || gh release upload "$TAG" main.js manifest.json styles.css --clobber --repo "${{ github.repository }}"
